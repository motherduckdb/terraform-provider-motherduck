<title id="title">Blueprints code promotion</title><desc id="desc">Terraform first provisions the staging and production accounts. With staging enabled, each pull request deploys a preview and a merge to main deploys staging, both under the staging account. An approved release deploys its exact tag under the separate production account. Arrows promote code, not database contents.</desc>
