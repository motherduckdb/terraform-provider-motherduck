<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="580" viewBox="0 0 1320 580" role="img" aria-labelledby="title desc">
<title id="title">Layered warehouse</title><desc id="desc">One writer account owns raw, transform, and marts databases. A pipeline loads raw orders. The Terraform-managed orders_latest view deduplicates them. The pipeline then refreshes the daily_revenue table. BI connects with the writer&#x27;s read-scaling token, which can read every layer through the writer&#x27;s read pool.</desc>
