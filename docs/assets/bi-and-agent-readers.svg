<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="590" viewBox="0 0 1320 590" role="img" aria-labelledby="title desc">
<title id="title">BI tools and AI agents as separate readers</title><desc id="desc">A pipeline loads a marts database owned by one writer account. One restricted share publishes it. Terraform grants the share to a separate reader account for dashboards, for notebooks, and for an AI agent. Each reader attaches the share once and its consumer queries on that reader&#x27;s own read pool with a read-scaling token.</desc>
