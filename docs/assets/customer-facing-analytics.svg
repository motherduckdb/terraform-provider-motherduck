<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="604" viewBox="0 0 1320 604" role="img" aria-labelledby="title desc">
<title id="title">Customer-facing analytics</title><desc id="desc">A pipeline writes each tenant&#x27;s data through one central writer that owns the Acme and Globex databases and their restricted shares. Terraform grants each share only to its tenant&#x27;s reader account, which attaches it once and queries on its own read pool. The backend authenticates the user and routes queries to the matching reader.</desc>
