<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520" role="img" aria-labelledby="title desc">
<title id="title">Data lake on your own bucket</title><desc id="desc">Terraform provisions a scoped S3 secret, a DuckLake database, a schema, and a table in the writer account. A pipeline loads data through the writer&#x27;s Duckling. The DuckLake catalog stays in MotherDuck and the data files are written to an S3 prefix in your AWS account through the scoped secret.</desc>
