<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="464" viewBox="0 0 1320 464" role="img" aria-labelledby="title desc">
<title id="title">MotherDuck infrastructure with Terraform</title><desc id="desc">Terraform manages accounts, compute, data, and access. A pipeline writes through the writer&#x27;s Duckling to its database. A read-only share publishes data to a separate reader account and read pool for BI and applications.</desc>
