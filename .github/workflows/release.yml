name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release inputs
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! -f "release-notes/${VERSION}.md" ]]; then
            echo "Release notes file release-notes/${VERSION}.md is required." >&2
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run release preflight checks
        run: make release-preflight-check release-check

      # Advisory only for releases: a newly published advisory in an indirect
      # dependency must not block shipping an unrelated fix. Pull-request CI
      # keeps vulncheck blocking through `make static-check`.
      - name: Run vulnerability check (advisory)
        continue-on-error: true
        run: make vulncheck

  live-contracts:
    name: Live release contracts
    timeout-minutes: 30
    needs: preflight
    runs-on: ubuntu-latest
    environment: motherduck-live
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Run required SQL contracts
        run: make test-live-required

  build:
    name: Build ${{ matrix.goos }}_${{ matrix.goarch }}
    timeout-minutes: 20
    needs:
      - preflight
      - live-contracts
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Package provider
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          DIST_DIR: ${{ github.workspace }}/dist
        run: ./scripts/package-release.sh

      - name: Setup Terraform for artifact verification
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Install and start release artifact
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.goos }}_${{ matrix.goarch }}
        run: bash scripts/test-release-package.sh "${GITHUB_WORKSPACE}/dist/terraform-provider-motherduck_${VERSION#v}_${TARGET}.zip" "${VERSION}"

      - name: Create package digest
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd dist
          shasum -a 256 -- *.zip > "provider_${GOOS}_${GOARCH}.sha256"
          shasum -a 256 -c "provider_${GOOS}_${GOARCH}.sha256"

      - name: Attest package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    timeout-minutes: 10
    needs:
      - preflight
      - live-contracts
      - build
    runs-on: ubuntu-latest
    environment: motherduck-release
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Verify packages and create checksums
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          manifest="terraform-provider-motherduck_${version}_manifest.json"
          checksum="terraform-provider-motherduck_${version}_SHA256SUMS"
          cp terraform-registry-manifest.json "dist/${manifest}"
          cd dist
          shopt -s nullglob
          digest_files=(provider_*.sha256)
          if [[ "${#digest_files[@]}" -eq 0 ]]; then
            echo "No per-build digest files found." >&2
            exit 1
          fi
          sha256sum -c "${digest_files[@]}"
          # Per-build digests exist only to detect corruption between the build
          # jobs and this one. They are not release assets: the Registry
          # validates every attached file and rejects names that are not
          # provider packages, checksums, signature, or manifest.
          rm -f "${digest_files[@]}"
          packages=(terraform-provider-motherduck_"${version}"_*.zip)
          if [[ "${#packages[@]}" -ne 4 ]]; then
            echo "Expected exactly four provider packages for version ${version}." >&2
            exit 1
          fi
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            test -f "terraform-provider-motherduck_${version}_${target}.zip"
          done
          sha256sum "${packages[@]}" "${manifest}" > "${checksum}"
          sha256sum -c "${checksum}"

      - name: Sign checksums for the Terraform Registry
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ vars.GPG_FINGERPRINT }}
        run: |
          version="${VERSION#v}"
          ./scripts/sign-release.sh "dist/terraform-provider-motherduck_${version}_SHA256SUMS"

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          notes_file="release-notes/${VERSION}.md"
          if [[ ! -f "${notes_file}" ]]; then
            echo "Release notes file ${notes_file} is required." >&2
            exit 1
          fi
          for required in \
            "terraform-provider-motherduck_${version}_SHA256SUMS" \
            "terraform-provider-motherduck_${version}_SHA256SUMS.sig" \
            "terraform-provider-motherduck_${version}_manifest.json"; do
            if [[ ! -s "dist/${required}" ]]; then
              echo "Registry requires dist/${required}." >&2
              exit 1
            fi
          done
          gh release create "${VERSION}" dist/* \
            --verify-tag \
            --title "${VERSION}" \
            --notes-file "${notes_file}"
