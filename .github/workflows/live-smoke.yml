name: Live Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      terraform_versions:
        description: "Terraform versions to test, separated by spaces or commas"
        required: false
        default: "1.5.7 1.8.5 1.12.2 1.15.8 1.15.9 1.16.1"
      opentofu_versions:
        description: "OpenTofu versions to test, separated by spaces or commas"
        required: false
        default: "1.12.6"
      run_sql_lifecycle:
        description: "Run SQL create/destroy lifecycle checks for every Terraform version"
        type: boolean
        required: false
        default: false
      run_blueprint_lifecycle:
        description: "Run SQL-only blueprint lifecycle checks for every Terraform version"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-main:
    name: Live exact-main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: motherduck-live
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Run required SQL contracts
        run: make test-live-required

  prepare-matrix:
    name: Prepare CLI matrix
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: matrix
        shell: bash
        env:
          TF_VERSIONS: ${{ inputs.terraform_versions || '1.5.7 1.8.5 1.12.2 1.15.8 1.15.9 1.16.1' }}
          TOFU_VERSIONS: ${{ inputs.opentofu_versions || '1.12.6' }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SQL_LIFECYCLE: ${{ inputs.run_sql_lifecycle || false }}
          MANUAL_BLUEPRINT_LIFECYCLE: ${{ inputs.run_blueprint_lifecycle || false }}
        run: |
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import os
          import re
          import sys

          def versions(name):
              values = [v for v in re.split(r"[\s,]+", os.environ.get(name, "")) if v]
              for value in values:
                  if not re.fullmatch(r"\d+\.\d+\.\d+", value):
                      print(f"Invalid {name} value {value!r}; use versions like 1.16.1.", file=sys.stderr)
                      sys.exit(1)
              return values

          def enabled(name):
              return os.environ.get(name, "").lower() == "true"

          include = []
          for cli, version in ([('terraform', v) for v in versions('TF_VERSIONS')] +
                               [('opentofu', v) for v in versions('TOFU_VERSIONS')]):
              if os.environ.get("EVENT_NAME") == "schedule":
                  sql_lifecycle = (
                      (cli == "terraform" and version in {"1.5.7", "1.16.1"}) or
                      (cli == "opentofu" and version == "1.12.6")
                  )
                  blueprint_lifecycle = cli == "terraform" and version == "1.16.1"
              else:
                  sql_lifecycle = enabled("MANUAL_SQL_LIFECYCLE")
                  blueprint_lifecycle = enabled("MANUAL_BLUEPRINT_LIFECYCLE")
              include.append({
                  "cli": cli,
                  "version": version,
                  "sql_lifecycle": sql_lifecycle,
                  "blueprint_lifecycle": blueprint_lifecycle,
              })
          if not include:
              print("No Terraform or OpenTofu versions configured.", file=sys.stderr)
              sys.exit(1)
          print("matrix=" + json.dumps({"include": include}, separators=(",", ":")))
          PY

  live-smoke:
    name: Live MotherDuck smoke (${{ matrix.cli }} ${{ matrix.version }})
    needs: prepare-matrix
    runs-on: ubuntu-latest
    environment: motherduck-live
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      TF_VERSIONS: ${{ matrix.cli == 'terraform' && matrix.version || '' }}
      TOFU_VERSIONS: ${{ matrix.cli == 'opentofu' && matrix.version || '' }}
      TF_VERSION_SQL_LIFECYCLE: ${{ matrix.sql_lifecycle && '1' || '0' }}
      TF_VERSION_BLUEPRINT_LIFECYCLE: ${{ matrix.blueprint_lifecycle && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Require live credentials
        shell: bash
        run: |
          if [[ -z "${MOTHERDUCK_TOKEN}" ]]; then
            echo "MOTHERDUCK_TOKEN is required for live smoke." >&2
            exit 1
          fi
      - name: Run Terraform and OpenTofu live contracts
        run: make test-terraform-versions

  cleanup:
    name: Audit live cleanup
    needs: live-smoke
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    environment: motherduck-live
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Audit live cleanup
        run: make test-live-cleanup-audit
