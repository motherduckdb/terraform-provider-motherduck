version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The embedded DuckDB version must be one MotherDuck already accepts.
      # Newer duckdb-go / duckdb-go-bindings releases can ship before the
      # service supports that DuckDB client, and offline CI cannot detect it.
      # Bump these by hand and run a live SQL smoke first. See CONTRIBUTING.md.
      - dependency-name: "github.com/duckdb/duckdb-go/*"
      - dependency-name: "github.com/duckdb/duckdb-go-bindings*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Example application dependencies. Grouped and capped so example upkeep
  # does not crowd out provider updates.
  - package-ecosystem: npm
    directory: /examples/customer-facing-analytics/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      customer-facing-analytics-backend:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /examples/cookbook-pipeline
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      cookbook-pipeline:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /examples/pulumi/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # requirements.txt pins every transitive dependency, and Dependabot
      # bumps each pin on its own. Pulumi still requires protobuf<7, so a
      # protobuf 7 pin makes the file unsatisfiable. Regenerate the pins with
      # uv as the file header describes when Pulumi allows protobuf 7.
      - dependency-name: "protobuf"
        update-types: ["version-update:semver-major"]
    groups:
      pulumi-python:
        patterns:
          - "*"
