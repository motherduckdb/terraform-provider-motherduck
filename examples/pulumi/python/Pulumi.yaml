name: motherduck-pulumi-example
description: A minimal Pulumi Python program using the MotherDuck Terraform provider
runtime:
  name: python
  options:
    virtualenv: .venv
packages:
  motherduck:
    source: terraform-provider
    version: 1.4.0
    parameters:
      - registry.terraform.io/motherduckdb/motherduck
      - 0.3.4
