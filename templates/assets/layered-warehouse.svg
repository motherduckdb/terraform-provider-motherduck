<title id="title">Layered warehouse</title><desc id="desc">One writer account owns raw, transform, and marts databases. Raw orders feed the orders_latest view, then a pipeline refreshes the daily_revenue physical table. BI uses the same writer identity&#x27;s read pool, which can access all three layers.</desc>
