<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="226" viewBox="0 0 1080 226" role="img" aria-labelledby="title desc">
<title id="title">Blueprints promotion</title><desc id="desc">With optional staging enabled, pull requests deploy previews and main deploys staging under the staging account. A release deploys its exact tag under the production account. Terraform provisions the identities first. Code is promoted, not data.</desc>
<rect width="1080" height="226" fill="#F8F8F7"/>
<rect x="32" y="32" width="658" height="162" rx="2" fill="#F4EFEA" stroke="#C5BBB1"/>
<text x="50" y="60" fill="#383838" font-family="Arial, sans-serif" font-size="16" font-weight="700">Staging account</text>
<rect x="738" y="32" width="310" height="162" rx="2" fill="#F4EFEA" stroke="#C5BBB1"/>
<text x="756" y="60" fill="#383838" font-family="Arial, sans-serif" font-size="16" font-weight="700">Production account</text>
<rect x="52" y="99" width="244" height="66" rx="2" fill="#D0EEE8" stroke="#383838"/>
<text x="68" y="131" fill="#383838" font-family="Arial, sans-serif" font-size="20" font-weight="700">Preview</text>
<text x="68" y="153" fill="#383838" font-family="Arial, sans-serif" font-size="14" font-weight="400">Pull request</text>
<rect x="424" y="99" width="244" height="66" rx="2" fill="#D0EEE8" stroke="#383838"/>
<text x="440" y="131" fill="#383838" font-family="Arial, sans-serif" font-size="20" font-weight="700">Staging</text>
<text x="440" y="153" fill="#383838" font-family="Arial, sans-serif" font-size="14" font-weight="400">Main</text>
<rect x="758" y="99" width="270" height="66" rx="2" fill="#CEEBFF" stroke="#383838"/>
<text x="774" y="131" fill="#383838" font-family="Arial, sans-serif" font-size="20" font-weight="700">Production</text>
<text x="774" y="153" fill="#383838" font-family="Arial, sans-serif" font-size="14" font-weight="400">Release tag</text>
<polyline points="296,132 424,132" fill="none" stroke="#383838" stroke-width="2"/>
<polygon points="424,132 416,127 416,137" fill="#383838"/>
<text x="337" y="119" fill="#666666" font-family="Arial, sans-serif" font-size="14" font-weight="400">merge</text>
<polyline points="668,132 758,132" fill="none" stroke="#383838" stroke-width="2"/>
<polygon points="758,132 750,127 750,137" fill="#383838"/>
<text x="684" y="119" fill="#666666" font-family="Arial, sans-serif" font-size="14" font-weight="400">release</text>
</svg>
