<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Deployment model</title><desc id="desc">Admin Terraform provisions service accounts and compute. Writer-scoped Terraform creates writer-owned databases and restricted shares. A separate pipeline loads data. Reader accounts attach shares and query on independent read pools.</desc>
